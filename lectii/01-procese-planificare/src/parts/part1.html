<section class="lesson" id="s1" data-num="1" data-title="Ce este un sistem de operare">
<script type="text/markdown">
### Definiție

Un **sistem de operare (SO)** este software-ul de bază care:

1. **gestionează resursele** calculatorului — CPU, memorie, dispozitive de I/O, stocare, rețea;
2. **oferă o interfață** între aplicații (și utilizator) și hardware, astfel încât programele să nu depindă de detalii fizice ale plăcii de bază.

Fără SO, fiecare aplicație ar trebui să implementeze singură accesul la disc, memorie și periferice — un model impracticabil.

### Scurt istoric: apariție și evoluție

| Etapă | Ce s-a schimbat |
|---|---|
| Anii 1950 | Calculatoarele rulează **un singur job** odată; operatorul încarcă programele manual (benzi, cartele). |
| Batch | Job-urile sunt grupate și rulate pe rând, fără interacțiune permanentă la consolă — crește utilizarea mașinii. |
| Time-sharing (anii 1960–70) | Mai mulți utilizatori / programe **împart** CPU-ul în intervale scurte; apare ideea de multitasking interactiv. |
| SO pe PC (anii 1980–90) | MS-DOS, apoi Windows; pe stații Unix/Linux — model client–server și rețea. |
| SO moderne | Multitasking preemptiv, memorie virtuală, GUI, mobil, cloud; nucleul rămâne responsabil de resurse și izolare. |

Evoluția esențială: de la **o mașină – un program** la **partajarea controlată** a resurselor între multe programe și utilizatori.

### Sisteme de operare cunoscute azi

| Familie | Exemple | Domeniu tipic |
|---|---|---|
| Windows | Windows 10 / 11 | desktop, laptop, o parte din servere |
| macOS | macOS Sonoma / Sequoia… | calculatoare Apple |
| Linux | Ubuntu, Fedora, Debian, RHEL… | servere, dezvoltare, embedded, desktop |
| Mobile | Android, iOS | telefoane și tablete |
| Specializate | variante de timp real, SO pentru routere etc. | industrie, rețea |

În laborator vom lucra conceptual pe **Linux** și **Windows**, deoarece acoperă majoritatea scenariilor academice și profesionale.
</script>
</section>


<section class="lesson" id="s2" data-num="2" data-title="Componentele unui SO">
<script type="text/markdown">
### Ce „piese” are un sistem de operare

Un SO nu e un singur fișier, ci un set de componente cu roluri distincte. Cele esențiale:

| Componentă | Ce este | Rol |
|---|---|---|
| **Kernel (nucleu)** | partea privilegiată a SO-ului | controlează CPU, memorie, dispozitive; decide cine rulează și când |
| **Gestionar de procese** | subsistem al kernelului | creează / oprește procese, ține stările, planifică CPU |
| **Gestionar de memorie** | alocare și protecție | împarte RAM, izolează procesele, suportă memorie virtuală |
| **Sistem de fișiere** | organizarea datelor pe disc | directorare, permisiuni, citire/scriere |
| **Gestionar de I/O** | legătura cu perifericele | drivere, buffere, acces la tastatură, disc, rețea |
| **Interfață utilizator** | shell și/sau GUI | permite lansarea programelor și administrarea sistemului |

### Kernel, spațiu utilizator, apeluri de sistem

- **Kernel** — rulează în mod privilegiat; are acces direct la hardware.
- **Spațiu utilizator** — aici rulează aplicațiile (browser, editor, jocuri). Ele **nu** accesează hardware-ul direct.
- **Apel de sistem** (*system call*) — cererea oficială a unei aplicații către kernel (ex.: deschidere fișier, creare proces).

```text
aplicație / shell  (spațiu utilizator)
        │  apel de sistem
        ▼
     kernel
        │
        ▼
   hardware (CPU, RAM, disc, rețea…)
```

### Shell și GUI

| | Shell | GUI |
|---|---|---|
| Formă | linie de comandă (text) | ferestre, icoane, meniuri |
| Exemple | `bash`, PowerShell, CMD | Explorer, GNOME, Dock |
| Rol | lansează programe, administrează fișiere și procese | același tip de operații, prin interfață grafică |

Ambele cer servicii kernelului; diferă doar modul de interacțiune.
</script>
</section>


<section class="lesson" id="s3" data-num="3" data-title="Clasificare (pe scurt)">
<script type="text/markdown">
### Tipuri de sisteme de operare

Clasificarea de mai jos e utilă la examen și pentru a plasa un SO real într-o categorie:

| Tip | Caracteristică principală | Exemplu de context |
|---|---|---|
| **Batch** | job-uri pe rând, fără interacțiune continuă | centre de calcul clasice |
| **Time-sharing** | partajarea CPU între mai multe programe/utilizatori | PC, servere Linux/Windows |
| **Timp real** | răspunsul trebuie să respecte un termen strict | control industrial, ABS |
| **Distribuit** | resurse pe mai multe noduri, văzute ca un sistem | clustere, cloud |
| **Mobil** | energie, senzori, izolare aplicații | Android, iOS |

### Arhitecturi de kernel (orientare)

| Tip | Idee | Exemplu |
|---|---|---|
| **Monolitic** | multe servicii în nucleu | Linux (model clasic) |
| **Microkernel** | nucleu minimal; restul în servicii separate | Minix, QNX |
| **Hibrid** | combinație pragmatică | Windows NT |

Pentru cursul de bază e suficient să rețineți: SO-urile desktop/server moderne sunt, în esență, **time-sharing** cu multitasking preemptiv; nucleele diferă ca organizare internă.
</script>
</section>
